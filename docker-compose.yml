services:
  # --- DATABASE SERVICE ---
  sentinel-db:
    image: postgres:15
    container_name: sentinel-db
    restart: unless-stopped
    networks:
      - sentinel-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- BACKEND API SERVICE ---
  sentinel-api:
    build: .
    container_name: sentinel-api
    restart: unless-stopped
    networks:
      - sentinel-network
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sentinel-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- FRONTEND UI SERVICE ---
  frontend:
    build:
      context: ./sentinel-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: sentinel-ui
    restart: unless-stopped
    networks:
      - sentinel-network
    depends_on:
      sentinel-api:
        condition: service_healthy

  # --- REVERSE PROXY / TLS ---
  caddy:
    image: caddy:2-alpine
    container_name: sentinel-caddy
    restart: unless-stopped
    networks:
      - sentinel-network
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
      - sentinel-api

networks:
  sentinel-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
