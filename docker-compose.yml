version: '3.8'

services:
  # --- DATABASE SERVICE ---
  sentinel-db:
    image: postgres:15
    container_name: sentinel-db
    restart: unless-stopped
    networks:
      - sentinel-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- BACKEND API SERVICE ---
  sentinel-api:
    build: .
    container_name: sentinel-api
    restart: unless-stopped
    networks:
      - sentinel-network
    ports:
      - "8080:8080"
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sentinel-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- FRONTEND UI SERVICE ---
  frontend:
    build:
      context: ./sentinel-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: sentinel-ui
    restart: unless-stopped
    networks:
      - sentinel-network
    ports:
      - "80:80"
    depends_on:
      sentinel-api:
        condition: service_healthy

networks:
  sentinel-network:
    driver: bridge

volumes:
  pgdata:
