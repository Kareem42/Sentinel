spring:
  application:
    name: sentinel

jwt:
  secret: ${JWT_SECRET:YourLongSecureSecretKeyThatIsAtLeast32CharactersLongForHS256!!}
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Optional: Change the logging level to see more detail if things fail
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

